<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking confirmed · Riverfront Retreat RV Park</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Work+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#F2F4EF;--surface:#fff;--ink:#16231E;--muted:#56635C;--line:#D5DBD3;--river:#1C6B66;--pine:#1E3A31;--amber:#B9781C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1714;--surface:#17221E;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2A3832;--river:#4FB3AA;--amber:#E0A34A;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Work Sans",system-ui,sans-serif}
header{background:var(--pine);color:#fff;padding:14px max(16px,env(safe-area-inset-left))}
header a{color:#fff;font:700 1.15rem "Zilla Slab",Georgia,serif;text-decoration:none}
main{max-width:560px;margin:48px auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:14px}
h1{font:700 2rem/1.15 "Zilla Slab",Georgia,serif;margin:0}
.eyebrow{font:500 .78rem "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted)} dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.site{font:700 3rem/1 "Zilla Slab",Georgia,serif;color:var(--river)}
p{margin:0} .muted{color:var(--muted)}
a.btn{justify-self:start;background:var(--river);color:#fff;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header><a href="/">Riverfront Retreat RV Park</a></header>
<main>
  <div class="card" id="card">
    <span class="eyebrow">Booking</span>
    <h1 id="h">Checking your payment…</h1>
    <p class="muted" id="msg">This takes a few seconds.</p>
  </div>
</main>
<script>
const fmt = s => new Date(s+'T00:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async function load(tries=0){
  const sid = new URLSearchParams(location.search).get('session_id');
  try{
    const r = await fetch('/api/booking-status?session_id='+encodeURIComponent(sid||''));
    const b = await r.json();
    if(!r.ok) throw new Error(b.error);
    if(b.status!=='confirmed'){ if(tries<5) return setTimeout(()=>load(tries+1),2000); throw new Error('We haven\'t received your payment yet. If you were charged, call us and we\'ll sort it out.'); }
    document.getElementById('card').innerHTML = `
      <span class="eyebrow">You're booked</span>
      <h1>See you on the river, ${esc((b.name||'').split(' ')[0])}!</h1>
      ${b.site?`<div><span class="eyebrow">Your site</span><div class="site">Site ${b.site}</div></div>`:''}
      <dl>
        <dt>Arrive</dt><dd>${fmt(b.checkIn)}</dd>
        <dt>Leave</dt><dd>${fmt(b.checkOut)}</dd>
        <dt>Paid</dt><dd>$${b.amount.toLocaleString('en-US')}</dd>
      </dl>
      ${b.note?`<p class="muted">${esc(b.note)}</p>`:''}
      <p class="muted">Your receipt is on its way by email. Questions? Call or text (601) 408-1851 or (601) 620-8833.</p>
      <p class="muted">120 Old Hwy 24, New Augusta, MS 39462</p>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=120+Old+Hwy+24+New+Augusta+MS+39462">Get directions</a>`;
  }catch(e){
    document.getElementById('h').textContent='We couldn\'t confirm this booking';
    document.getElementById('msg').textContent = e.message + ' Call (601) 408-1851 or (601) 620-8833.';
  }
})();
</script>
</body>
</html>
